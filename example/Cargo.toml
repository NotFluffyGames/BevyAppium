[package]
name = "bevyappium-example"
description = "Example game used as the BevyAppium test subject"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
# Turn the Agent on for test builds only.
bevyappium = ["bevyappium-agent/enabled"]

[dependencies]
bevy = { workspace = true, features = ["ui", "x11", "png"] }
bevyappium-agent = { path = "../agent" }
