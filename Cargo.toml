[workspace]
members = ["agent", "example"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
# One pinned Bevy version, updated only when the owner chooses.
bevy = { version = "=0.20.1", default-features = false }

[profile.dev]
opt-level = 1
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 1
